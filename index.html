<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lịch đặt xe cảm biến CTTG</title>
<style>
  :root{
    --gold:#c9971e;
    --gold-dark:#8a6a14;
    --red:#e2452a;
    --brown:#6b4a23;
    --cream:#fffaf0;
    --ink:#2b2118;
    --line:#e7d9bd;
    --b01:#6b4310;
    --b01-bg:#fbead0;
    --b:#7a1913;
    --b-bg:#fbe2df;
    --c1:#123c43;
    --c1-bg:#dcf0f2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI", Roboto, Arial, sans-serif;
    background:var(--cream);
    color:var(--ink);
  }
  header{
    background:linear-gradient(180deg,#fffdf7,#f6ecd6);
    border-bottom:3px solid var(--gold);
    padding:14px 20px;
    display:flex;
    align-items:center;
    gap:14px;
  }
  header img{
    height:56px;
    width:auto;
  }
  header h1{
    font-size:1.35rem;
    margin:0;
    color:var(--brown);
    letter-spacing:0.5px;
  }
  .toolbar{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 20px;
    background:#fff;
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  #btnAdd{
    background:var(--red);
    color:#fff;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    font-weight:600;
    font-size:0.95rem;
    cursor:pointer;
    white-space:nowrap;
    box-shadow:0 2px 4px rgba(226,69,42,0.3);
  }
  #btnAdd:hover{ background:#c9391f; }
  .btn-secondary{
    background:#fff;
    color:var(--brown);
    border:1px solid var(--gold);
    padding:10px 16px;
    border-radius:8px;
    font-weight:600;
    font-size:0.95rem;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn-secondary:hover{ background:#fdf6ea; }
  .date-scroll{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:4px 2px;
    flex:1;
    scrollbar-width:thin;
  }
  .date-pill{
    flex:0 0 auto;
    padding:8px 14px;
    border-radius:20px;
    border:1px solid var(--line);
    background:#fdf8ec;
    cursor:pointer;
    font-size:0.85rem;
    text-align:center;
    min-width:64px;
    color:var(--brown);
  }
  .date-pill .dow{ display:block; font-size:0.7rem; opacity:0.7; }
  .date-pill.today{ border-color:var(--gold); font-weight:700; }
  .date-pill.selected{
    background:var(--gold);
    color:#fff;
    border-color:var(--gold-dark);
  }
  .legend{
    display:flex;
    gap:16px;
    padding:10px 20px;
    font-size:0.82rem;
    flex-wrap:wrap;
    background:#fff;
    border-bottom:1px solid var(--line);
  }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .legend i{ width:14px; height:14px; border-radius:3px; display:inline-block; }
  .grid-wrap{
    overflow:auto;
    max-height:75vh;
    padding:16px;
  }
  table.grid{
    border-collapse:collapse;
    width:100%;
    min-width:900px;
    background:#fff;
  }
  table.grid th, table.grid td{
    border:1px solid var(--line);
    text-align:center;
    padding:0;
    font-size:0.8rem;
  }
  .time-col{
    width:56px;
    background:#faf5e8;
    font-weight:700;
    color:var(--brown);
    font-size:0.68rem;
    padding:6px 2px !important;
    white-space:nowrap;
    position:sticky;
    left:0;
    z-index:2;
  }
  thead th{
    font-weight:800;
    position:sticky;
    top:0;
    z-index:3;
    -webkit-transform:translateZ(0);
    transform:translateZ(0);
    background-color:#fff;
  }
  thead th.time-col, thead th.time-col-end{ z-index:6; }
  .time-col-end{ border-left:3px solid #b89a5e; }
  @media (max-width:600px){
    .time-col-end{ display:none; }
  }
  th.group-b01{ background:var(--b01-bg); color:var(--b01); }
  th.group-b{ background:var(--b-bg); color:var(--b); }
  th.group-c1{ background:var(--c1-bg); color:var(--c1); }
  th.car-head{
    padding:8px 8px 10px;
    min-width:150px;
  }
  th.car-head .hang-label{
    font-size:0.72rem;
    font-weight:700;
    opacity:0.8;
    letter-spacing:0.3px;
  }
  th.car-head .xe-label{
    font-size:1.2rem;
    font-weight:900;
    margin-top:2px;
  }
  .edit-icon{
    cursor:pointer;
    font-size:0.7rem;
    margin-left:4px;
    opacity:0.6;
  }
  .edit-icon:hover{ opacity:1; }
  td.cell-b01{ background:#fdf6ea; }
  td.cell-b{ background:#fdf2f1; }
  td.cell-c1{ background:#eefaf9; }
  td.booked{
    font-weight:800;
    font-size:0.95rem;
    color:#fff;
    padding:4px 6px !important;
    line-height:1.25;
    vertical-align:middle;
    position:relative;
  }
  td.booked .b-date, td.booked .b-time{
    display:block;
    font-size:0.85em;
    font-weight:700;
    opacity:0.92;
  }
  td.booked .b-xe{
    display:block;
    font-size:0.95em;
    font-weight:800;
    margin-top:2px;
  }
  td.booked .b-teacher{
    display:block;
    font-size:1.15em;
    font-weight:900;
    margin-top:3px;
  }
  td.booked .note{
    display:block;
    font-weight:500;
    font-size:0.8em;
    opacity:0.92;
    margin-top:2px;
  }
  .edit-booking{
    position:absolute;
    top:3px;
    right:3px;
    width:20px;
    height:20px;
    background:rgba(255,255,255,0.88);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    cursor:pointer;
    line-height:1;
  }
  .hour-mark td, .hour-mark th{ border-top:2px solid #c9b98a; }
  /* modal */
  .overlay{
    position:fixed; inset:0; background:rgba(30,20,10,0.45);
    display:none; align-items:center; justify-content:center; z-index:50;
    padding:16px;
  }
  .overlay.show{ display:flex; }
  .modal{
    background:#fff; border-radius:12px; padding:22px 24px;
    width:100%; max-width:420px; max-height:90vh; overflow:auto;
    box-shadow:0 12px 30px rgba(0,0,0,0.25);
  }
  .modal h2{
    margin:0 0 16px; font-size:1.1rem; color:var(--brown);
    border-bottom:2px solid var(--gold); padding-bottom:8px;
  }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:0.82rem; margin-bottom:4px; color:var(--brown); font-weight:600; }
  .field input, .field select{
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:0.9rem;
  }
  .row2{ display:flex; gap:10px; }
  .row2 .field{ flex:1; }
  .modal-actions{ display:flex; gap:10px; margin-top:18px; }
  .btn{
    flex:1; padding:10px; border-radius:8px; border:none; font-weight:600; cursor:pointer; font-size:0.9rem;
  }
  .btn-confirm{ background:var(--red); color:#fff; }
  .btn-cancel{ background:#eee; color:#555; }
  .msg{ font-size:0.85rem; color:var(--red); margin-top:4px; min-height:18px; }
  .confirm-box p{ margin:4px 0; font-size:0.9rem; }
  .confirm-box b{ color:var(--brown); }
  .history-modal{ max-width:480px; }
  .history-list{ max-height:60vh; overflow-y:auto; margin-top:4px; }
  .history-item{
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    margin-bottom:8px;
    font-size:0.85rem;
  }
  .history-item .h-top{
    display:flex;
    justify-content:space-between;
    font-size:0.72rem;
    color:#a08a6a;
    margin-bottom:4px;
  }
  .history-item .h-main{ font-weight:700; color:var(--brown); font-size:0.95rem; }
  .history-item .h-sub{ font-size:0.82rem; color:#555; margin-top:2px; }
  .history-empty{ text-align:center; color:#a08a6a; padding:20px; font-size:0.9rem; }
  footer{ text-align:center; padding:14px; font-size:0.75rem; color:#a08a6a; }

  @media (max-width:600px){
    header{ padding:10px 12px; gap:10px; }
    header img{ height:40px; }
    header h1{ font-size:1rem; }
    .toolbar{ padding:10px 12px; gap:10px; }
    #btnAdd{ padding:8px 12px; font-size:0.82rem; flex:0 0 auto; }
    .btn-secondary{ padding:8px 10px; font-size:0.82rem; }
    .btn-label{ display:none; }
    .legend{ padding:8px 12px; gap:10px; font-size:0.75rem; }
    .grid-wrap{ padding:8px; }
    .time-col{ width:50px; font-size:0.6rem; }
    th.car-head{ min-width:88px; padding:6px 4px 8px; }
    th.car-head .hang-label{ font-size:0.6rem; }
    th.car-head .xe-label{ font-size:0.95rem; }
    td.booked{ }
    .modal{ padding:16px 14px; max-width:100%; }
  }
</style>
</head>
<body>

<header>
  <img src="logo.png" alt="Logo CTTG">
  <h1>LỊCH ĐẶT XE CẢM BIẾN CTTG</h1>
</header>

<div class="toolbar">
  <button id="btnAdd">+ Đăng ký</button>
  <button id="btnHistory" class="btn-secondary">🕘 <span class="btn-label">Lịch sử</span></button>
  <div class="date-scroll" id="dateScroll"></div>
</div>

<div class="grid-wrap">
  <table class="grid" id="grid"></table>
</div>

<footer>Chỉ tài khoản admin mới đăng ký / sửa được xe · Người xem chỉ theo dõi lịch</footer>

<!-- Modal đăng ký -->
<div class="overlay" id="overlayForm">
  <div class="modal">
    <h2 id="formTitle">Đăng ký xe cảm biến</h2>
    <div class="field">
      <label>Ngày đăng ký</label>
      <input type="date" id="fDate">
    </div>
    <div class="row2">
      <div class="field">
        <label>Giờ bắt đầu</label>
        <select id="fStart"></select>
      </div>
      <div class="field">
        <label>Giờ kết thúc</label>
        <select id="fEnd"></select>
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Hạng</label>
        <select id="fHang">
          <option value="B.01">B.01</option>
          <option value="B">B</option>
          <option value="C1">C1</option>
        </select>
      </div>
      <div class="field">
        <label>Số xe</label>
        <select id="fXeSo"></select>
      </div>
    </div>
    <div class="field">
      <label>Tên giáo viên</label>
      <input type="text" id="fGiaoVien" placeholder="VD: Nguyễn Văn A">
    </div>
    <div class="field">
      <label>Ghi chú (nếu có)</label>
      <input type="text" id="fGhiChu" placeholder="Không bắt buộc">
    </div>
    <div class="msg" id="formMsg"></div>
    <div class="modal-actions">
      <button class="btn btn-cancel" id="btnCancelForm">Huỷ</button>
      <button class="btn" id="btnDeleteBooking" style="background:#fff;color:var(--red);border:1px solid var(--red);display:none;">Xoá lịch</button>
      <button class="btn btn-confirm" id="btnConfirmForm">Xác nhận</button>
    </div>
  </div>
</div>

<!-- Modal xác nhận thành công -->
<div class="overlay" id="overlaySuccess">
  <div class="modal">
    <h2>Đăng ký thành công</h2>
    <div class="confirm-box" id="successBox"></div>
    <div class="modal-actions">
      <button class="btn btn-confirm" id="btnCloseSuccess">Đóng</button>
    </div>
  </div>
</div>

<!-- Modal nhập mật khẩu admin -->
<div class="overlay" id="overlayPass">
  <div class="modal" style="max-width:320px;">
    <h2>Xác thực admin</h2>
    <div class="field">
      <label>Mật khẩu admin</label>
      <input type="password" id="passInput">
    </div>
    <div class="msg" id="passMsg"></div>
    <div class="modal-actions">
      <button class="btn btn-cancel" id="btnCancelPass">Huỷ</button>
      <button class="btn btn-confirm" id="btnConfirmPass">Xác nhận</button>
    </div>
  </div>
</div>

<!-- Modal lịch sử đăng ký -->
<div class="overlay" id="overlayHistory">
  <div class="modal history-modal">
    <h2>Lịch sử đăng ký (20 gần nhất)</h2>
    <div class="history-list" id="historyList"></div>
    <div class="modal-actions">
      <button class="btn btn-confirm" id="btnCloseHistory">Đóng</button>
    </div>
  </div>
</div>

<script>
/* ================== CẤU HÌNH ================== */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbziulsQsBzeJ4I0dnkj4uzd7tLXlOTLAOapwEDqEYZV2bVvTzvHhVzhmOnt80bX6wVZrw/exec';

/* ================== TIỆN ÍCH THỜI GIAN ================== */
function pad(n){ return n.toString().padStart(2,'0'); }
function toDateStr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function toDisplayDate(yyyyMmDd){
  const parts = (yyyyMmDd||'').split('-');
  if(parts.length!==3) return yyyyMmDd;
  return parts[2]+'/'+parts[1]+'/'+parts[0];
}
function toShortDate(yyyyMmDd){
  const parts = (yyyyMmDd||'').split('-');
  if(parts.length!==3) return yyyyMmDd;
  return parts[2]+'/'+parts[1];
}
function toShortTime(hhmm){
  const parts = (hhmm||'').split(':');
  if(parts.length!==2) return hhmm;
  return parseInt(parts[0],10)+'h'+parts[1];
}
function genSlots(){
  // Mốc giờ từ 05:00 đến 22:00, mỗi 30 phút (dùng để hiển thị dropdown & lưới)
  const out = [];
  for(let h=5; h<22; h++){
    for(let m=0; m<60; m+=30){
      out.push(pad(h)+':'+pad(m));
    }
  }
  out.push('22:00');
  return out;
}
const ALL_SLOTS = genSlots(); // 05:00 ... 22:00 (35 mốc -> 34 ô, mỗi ô 30 phút)

/* ================== TRẠNG THÁI ================== */
let selectedDate = toDateStr(new Date());
let carsConfig = { 'B.01':[], 'B':[], 'C1':[] };
let currentBookings = [];
let pendingAction = null; // callback chạy sau khi nhập đúng mật khẩu

/* ================== THANH CHỌN NGÀY ================== */
function renderDateScroll(){
  const wrap = document.getElementById('dateScroll');
  wrap.innerHTML = '';
  const today = new Date();
  const dows = ['CN','T2','T3','T4','T5','T6','T7'];
  for(let i=-1;i<=30;i++){
    const d = new Date(today);
    d.setDate(d.getDate()+i);
    const dstr = toDateStr(d);
    const pill = document.createElement('div');
    pill.className = 'date-pill' + (dstr===toDateStr(today)?' today':'') + (dstr===selectedDate?' selected':'');
    pill.innerHTML = '<span class="dow">'+dows[d.getDay()]+'</span>'+pad(d.getDate())+'/'+pad(d.getMonth()+1);
    pill.onclick = () => { selectedDate = dstr; renderDateScroll(); loadBookings(); };
    wrap.appendChild(pill);
  }
  // cuộn tới ngày hôm nay khi mở trang lần đầu
  const sel = wrap.querySelector('.selected');
  if(sel) sel.scrollIntoView({inline:'center', block:'nearest'});
}

/* ================== GỌI API ================== */
function api(params){
  const url = APPS_SCRIPT_URL + '?' + new URLSearchParams(params).toString();
  return fetch(url).then(r=>r.json());
}

function loadCars(){
  return api({action:'getCars'}).then(res=>{
    carsConfig = { 'B.01':[], 'B':[], 'C1':[] };
    (res.cars||[]).forEach(c=>{
      if(!carsConfig[c.hang]) carsConfig[c.hang]=[];
      carsConfig[c.hang].push(c);
    });
    Object.keys(carsConfig).forEach(h=> carsConfig[h].sort((a,b)=>a.viTri-b.viTri));
  });
}

function loadBookings(){
  document.getElementById('grid').innerHTML = '<tr><td style="padding:20px;">Đang tải lịch...</td></tr>';
  api({action:'getBookings', date:selectedDate}).then(res=>{
    currentBookings = res.bookings || [];
    renderGrid();
  }).catch(()=>{
    document.getElementById('grid').innerHTML = '<tr><td style="padding:20px;color:red;">Không tải được dữ liệu. Kiểm tra kết nối / cấu hình APPS_SCRIPT_URL.</td></tr>';
  });
}

/* ================== MÀU GIÁO VIÊN ================== */
function colorForName(name){
  let hash = 0;
  for(let i=0;i<name.length;i++){ hash = name.charCodeAt(i) + ((hash<<5)-hash); }
  const hue = Math.abs(hash) % 360;
  return 'hsl(' + hue + ',58%,42%)';
}

/* ================== VẼ LƯỚI ================== */
function renderGrid(){
  const table = document.getElementById('grid');
  const hangList = ['B.01','B','C1'];
  const classMap = {'B.01':'b01','B':'b','C1':'c1'};

  // build column list: {hang, viTri, xeSo}
  let columns = [];
  hangList.forEach(h => { carsConfig[h].forEach(c => columns.push({hang:h, viTri:c.viTri, xeSo:c.xeSo, cls:classMap[h]})); });

  // header row 1: group by hạng
  let thead = '<thead><tr>';
  thead += '<th class="time-col">Khung giờ</th>';
  columns.forEach((col, idx)=>{
    const label = col.xeSo ? ('Xe '+col.xeSo) : '(trống)';
    const isGroupStart = idx>0 && columns[idx-1].hang !== col.hang;
    const borderStyle = isGroupStart ? ' style="border-left:3px solid #b89a5e;"' : '';
    thead += '<th class="car-head group-'+col.cls+'"'+borderStyle+'>'+
      '<div class="hang-label">Hạng '+col.hang+'</div>'+
      '<div class="xe-label">'+label+
      '<span class="edit-icon" data-hang="'+col.hang+'" data-vitri="'+col.viTri+'" data-xeso="'+col.xeSo+'" title="Sửa số xe">✏️</span></div>'+
      '</th>';
  });
  thead += '<th class="time-col time-col-end">Khung giờ</th>';
  thead += '</tr></thead>';

  // build booking-per-slot map for quick lookup: key = hang|xeSo -> array[slotIndex] = bookingIndex or -1
  const slotCount = ALL_SLOTS.length - 1; // 34 ô (mỗi ô 30 phút)
  const map = {};
  columns.forEach(col=>{
    if(!col.xeSo) return;
    map[col.hang+'|'+col.xeSo] = new Array(slotCount).fill(-1);
  });
  currentBookings.forEach((b, bi)=>{
    const key = b.hang+'|'+b.xeSo;
    if(!map[key]) return;
    const startIdx = ALL_SLOTS.indexOf(b.gioBD);
    const endIdx = ALL_SLOTS.indexOf(b.gioKT);
    if(startIdx<0||endIdx<0) return;
    for(let s=startIdx; s<endIdx; s++){ map[key][s]=bi; }
  });

  // body rows
  let tbody = '<tbody>';
  for(let s=0; s<slotCount; s++){
    const isHour = ALL_SLOTS[s].endsWith(':00');
    tbody += '<tr'+(isHour?' class="hour-mark"':'')+'>';
    tbody += '<td class="time-col">'+toShortTime(ALL_SLOTS[s])+'-'+toShortTime(ALL_SLOTS[s+1])+'</td>';
    columns.forEach((col, idx)=>{
      const isGroupStart = idx>0 && columns[idx-1].hang !== col.hang;
      const gStyle = isGroupStart ? 'border-left:3px solid #b89a5e;' : '';
      if(!col.xeSo){ tbody += '<td class="cell-'+col.cls+'" style="'+gStyle+'"></td>'; return; }
      const arr = map[col.hang+'|'+col.xeSo];
      const bi = arr[s];
      if(bi === -1){
        tbody += '<td class="cell-'+col.cls+'" style="'+gStyle+'"></td>';
        return;
      }
      // chỉ vẽ ô ở vị trí bắt đầu chuỗi liên tiếp
      const isStart = (s===0) || (arr[s-1] !== bi);
      if(!isStart) return; // ô đã được gộp bởi rowspan phía trên
      let span = 1;
      while(s+span < slotCount && arr[s+span]===bi) span++;
      const b = currentBookings[bi];
      const color = colorForName(b.giaoVien || '');
      tbody += '<td class="booked" rowspan="'+span+'" style="background:'+color+';'+gStyle+'">'+
        '<span class="edit-booking" data-id="'+b.id+'" title="Sửa / xoá lịch">✏️</span>'+
        '<span class="b-date">'+toShortDate(b.ngay)+'</span>'+
        '<span class="b-time">'+toShortTime(b.gioBD)+'-'+toShortTime(b.gioKT)+'</span>'+
        '<span class="b-xe">Xe '+escapeHtml(b.xeSo)+'</span>'+
        '<span class="b-teacher">'+escapeHtml(b.giaoVien)+'</span>'+
        (b.ghiChu ? '<span class="note">'+escapeHtml(b.ghiChu)+'</span>' : '') +
        '</td>';
    });
    tbody += '<td class="time-col time-col-end">'+toShortTime(ALL_SLOTS[s])+'-'+toShortTime(ALL_SLOTS[s+1])+'</td>';
    tbody += '</tr>';
  }
  tbody += '</tbody>';

  table.innerHTML = thead + tbody;

  // Tự co giãn cỡ chữ trong từng ô đã đặt xe theo đúng kích cỡ thực tế của
  // ô đó (ô càng cao/rộng — do đặt nhiều khung giờ liên tiếp — thì chữ càng
  // to; ô nhỏ thì chữ nhỏ lại), để chữ luôn vừa khít trong ô.
  requestAnimationFrame(()=>{
    table.querySelectorAll('td.booked').forEach(cell=>{
      const h = cell.clientHeight;
      const w = cell.clientWidth;
      const size = Math.max(9, Math.min(h/6, w/8, 22));
      cell.style.fontSize = size+'px';
    });
  });

  // gắn sự kiện sửa số xe
  table.querySelectorAll('.edit-icon').forEach(el=>{
    el.onclick = (ev)=>{
      ev.stopPropagation();
      const hang = el.dataset.hang, viTri = el.dataset.vitri, xeSo = el.dataset.xeso;
      requireAdmin(()=> promptEditCar(hang, viTri, xeSo));
    };
  });

  // gắn sự kiện sửa/xoá lịch đã đặt
  table.querySelectorAll('.edit-booking').forEach(el=>{
    el.onclick = (ev)=>{
      ev.stopPropagation();
      const id = el.dataset.id;
      const booking = currentBookings.find(b=>b.id===id);
      if(booking) requireAdmin(()=> openForm(booking));
    };
  });
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function promptEditCar(hang, viTri, xeSo){
  const newXe = prompt('Nhập số xe mới cho hạng '+hang+' (vị trí '+viTri+'):', xeSo||'');
  if(newXe===null) return;
  api({action:'updateCar', hang:hang, viTri:viTri, xeSo:newXe.trim(), password:adminPass}).then(res=>{
    if(res.ok){ loadCars().then(renderGrid); }
    else alert(res.error||'Có lỗi xảy ra');
  });
}

/* ================== XÁC THỰC ADMIN ================== */
let adminPass = '';
function requireAdmin(callback){
  pendingAction = callback;
  document.getElementById('passInput').value = '';
  document.getElementById('passMsg').textContent = '';
  document.getElementById('overlayPass').classList.add('show');
  document.getElementById('passInput').focus();
}
document.getElementById('btnCancelPass').onclick = ()=>{
  document.getElementById('overlayPass').classList.remove('show');
  pendingAction = null;
};
document.getElementById('btnConfirmPass').onclick = ()=>{
  const val = document.getElementById('passInput').value;
  api({action:'checkAdmin', password:val}).then(res=>{
    if(res.ok){
      adminPass = val;
      document.getElementById('overlayPass').classList.remove('show');
      const cb = pendingAction; pendingAction = null;
      if(cb) cb();
    } else {
      document.getElementById('passMsg').textContent = 'Sai mật khẩu admin, vui lòng thử lại.';
    }
  });
};

/* ================== FORM ĐĂNG KÝ / SỬA ================== */
let editingId = null;

document.getElementById('btnAdd').onclick = ()=> requireAdmin(()=> openForm(null));

function openForm(booking){
  editingId = booking ? booking.id : null;
  const today = new Date();
  const todayStr = toDateStr(today);
  const dateInput = document.getElementById('fDate');
  dateInput.min = todayStr;

  document.getElementById('formTitle').textContent = booking ? 'Sửa lịch đặt xe' : 'Đăng ký xe cảm biến';
  document.getElementById('btnDeleteBooking').style.display = booking ? 'block' : 'none';

  if(booking){
    dateInput.value = booking.ngay;
  } else {
    dateInput.value = (selectedDate >= todayStr) ? selectedDate : todayStr;
  }

  fillTimeOptions();
  fillHangOptions();

  if(booking){
    // đảm bảo giờ/hạng/xe của lịch đang sửa luôn có trong danh sách chọn,
    // kể cả khi giờ đó đã "qua" so với thời điểm hiện tại
    ensureOption(document.getElementById('fStart'), booking.gioBD);
    ensureOption(document.getElementById('fEnd'), booking.gioKT);
    document.getElementById('fHang').value = booking.hang;
    fillXeSoOptions();
    ensureOption(document.getElementById('fXeSo'), booking.xeSo, 'Xe '+booking.xeSo);
    document.getElementById('fStart').value = booking.gioBD;
    document.getElementById('fEnd').value = booking.gioKT;
    document.getElementById('fXeSo').value = booking.xeSo;
    document.getElementById('fGiaoVien').value = booking.giaoVien || '';
    document.getElementById('fGhiChu').value = booking.ghiChu || '';
  } else {
    document.getElementById('fGiaoVien').value = '';
    document.getElementById('fGhiChu').value = '';
  }

  document.getElementById('formMsg').textContent = '';
  document.getElementById('overlayForm').classList.add('show');
}

function ensureOption(selectEl, value, label){
  if(!value) return;
  const exists = Array.from(selectEl.options).some(o=>o.value===String(value));
  if(!exists){
    const opt = document.createElement('option');
    opt.value = value;
    opt.textContent = label || value;
    selectEl.appendChild(opt);
  }
}

document.getElementById('btnCancelForm').onclick = ()=> document.getElementById('overlayForm').classList.remove('show');

document.getElementById('fDate').addEventListener('change', fillTimeOptions);
document.getElementById('fHang').addEventListener('change', fillXeSoOptions);

function fillTimeOptions(){
  const dateVal = document.getElementById('fDate').value;
  const now = new Date();
  const isToday = dateVal === toDateStr(now);
  const startSel = document.getElementById('fStart');
  const endSel = document.getElementById('fEnd');
  const available = ALL_SLOTS.filter(t => !isToday || t > pad(now.getHours())+':'+pad(now.getMinutes()));
  startSel.innerHTML = available.slice(0,-1).map(t=>'<option value="'+t+'">'+t+'</option>').join('');
  endSel.innerHTML = available.slice(1).map(t=>'<option value="'+t+'">'+t+'</option>').join('');
  if(endSel.options.length) endSel.selectedIndex = 0;
}

function fillHangOptions(){
  fillXeSoOptions();
}
function fillXeSoOptions(){
  const hang = document.getElementById('fHang').value;
  const sel = document.getElementById('fXeSo');
  const list = (carsConfig[hang]||[]).filter(c=>c.xeSo);
  sel.innerHTML = list.map(c=>'<option value="'+c.xeSo+'">Xe '+c.xeSo+'</option>').join('');
}

document.getElementById('btnConfirmForm').onclick = ()=>{
  const date = document.getElementById('fDate').value;
  const start = document.getElementById('fStart').value;
  const end = document.getElementById('fEnd').value;
  const hang = document.getElementById('fHang').value;
  const xeSo = document.getElementById('fXeSo').value;
  const giaoVien = document.getElementById('fGiaoVien').value.trim();
  const ghiChu = document.getElementById('fGhiChu').value.trim();
  const msg = document.getElementById('formMsg');

  if(!date || !start || !end || !hang || !xeSo || !giaoVien){
    msg.textContent = 'Vui lòng nhập đầy đủ thông tin bắt buộc.';
    return;
  }
  if(start >= end){
    msg.textContent = 'Giờ bắt đầu phải trước giờ kết thúc.';
    return;
  }
  msg.textContent = 'Đang xử lý...';

  const action = editingId ? 'updateBooking' : 'createBooking';
  const params = {action, date, start, end, hang, xeSo, giaoVien, ghiChu, password:adminPass};
  if(editingId) params.id = editingId;

  api(params).then(res=>{
    if(res.error === 'CONFLICT'){
      msg.textContent = 'Bị trùng, vui lòng đặt lại!';
    } else if(res.error){
      msg.textContent = res.error;
    } else {
      document.getElementById('overlayForm').classList.remove('show');
      showSuccess(res.booking, !!editingId);
      loadBookings();
    }
  });
};

document.getElementById('btnDeleteBooking').onclick = ()=>{
  if(!editingId) return;
  if(!confirm('Xoá lịch đặt xe này?')) return;
  api({action:'deleteBooking', id:editingId, password:adminPass}).then(res=>{
    if(res.ok){
      document.getElementById('overlayForm').classList.remove('show');
      loadBookings();
    } else {
      document.getElementById('formMsg').textContent = res.error || 'Có lỗi xảy ra';
    }
  });
};

function showSuccess(b, isEdit){
  document.querySelector('#overlaySuccess h2').textContent = isEdit ? 'Cập nhật thành công' : 'Đăng ký thành công';
  document.getElementById('successBox').innerHTML =
    '<p><b>Ngày:</b> '+toDisplayDate(b.ngay)+'</p>'+
    '<p><b>Thời gian:</b> '+b.gioBD+' - '+b.gioKT+'</p>'+
    '<p><b>Hạng:</b> '+b.hang+' &nbsp; <b>Số xe:</b> '+b.xeSo+'</p>'+
    '<p><b>Giáo viên:</b> '+escapeHtml(b.giaoVien)+'</p>'+
    (b.ghiChu ? '<p><b>Ghi chú:</b> '+escapeHtml(b.ghiChu)+'</p>' : '');
  document.getElementById('overlaySuccess').classList.add('show');
}
document.getElementById('btnCloseSuccess').onclick = ()=> document.getElementById('overlaySuccess').classList.remove('show');

/* ================== LỊCH SỬ ĐĂNG KÝ ================== */
document.getElementById('btnHistory').onclick = ()=>{
  document.getElementById('historyList').innerHTML = '<div class="history-empty">Đang tải...</div>';
  document.getElementById('overlayHistory').classList.add('show');
  api({action:'getHistory'}).then(res=>{
    const list = res.history || [];
    if(!list.length){
      document.getElementById('historyList').innerHTML = '<div class="history-empty">Chưa có lịch đăng ký nào.</div>';
      return;
    }
    document.getElementById('historyList').innerHTML = list.map(h=>
      '<div class="history-item">'+
        '<div class="h-top"><span>Điền đăng ký: '+h.ngayDangKy+'</span></div>'+
        '<div class="h-main">'+toDisplayDate(h.ngayThue)+' &nbsp; '+toShortTime(h.gioBD)+' - '+toShortTime(h.gioKT)+'</div>'+
        '<div class="h-sub">Xe '+escapeHtml(h.xeSo)+' (Hạng '+escapeHtml(h.hang)+') — GV: '+escapeHtml(h.giaoVien)+'</div>'+
      '</div>'
    ).join('');
  }).catch(()=>{
    document.getElementById('historyList').innerHTML = '<div class="history-empty">Không tải được lịch sử.</div>';
  });
};
document.getElementById('btnCloseHistory').onclick = ()=> document.getElementById('overlayHistory').classList.remove('show');

/* ================== KHỞI TẠO ================== */
renderDateScroll();
loadCars().then(()=>{ fillHangOptions(); loadBookings(); });
</script>
</body>
</html>
